name: Push and blueprint safety checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/blueprint-r02-pwa-20261021]
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-for-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Isolated database migration and RLS regression
        run: node scripts/check-r02-db.mjs
      - name: Build
        run: npm run build
