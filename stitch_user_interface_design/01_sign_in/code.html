<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ATM - Sign In</title>
<!-- Tailwind CSS CDN v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#D32F2F',
              dark: '#1e2022',
              cardBorder: '#f9dede',
              inputBorder: '#d1d5db',
              button: '#18191f'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-elements">
    /* Subtle bar chart vertical shapes */
    .chart-bar {
      background-color: rgba(255, 255, 255, 0.08);
      position: absolute;
      bottom: 0;
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col md:flex-row bg-[#fafafa] font-sans antialiased select-none overflow-x-hidden">
<!-- BEGIN: LeftBrandSection -->
<section class="relative w-full md:w-[48%] min-h-[500px] md:min-h-screen bg-[#212325] flex flex-col justify-between p-8 sm:p-12 lg:p-16 overflow-hidden border-b-[6px] md:border-b-0 md:border-b-[#c4161c] border-[#c4161c]" data-purpose="brand-sidebar">
<!-- Red bottom border line explicitly visible across full width -->
<div class="absolute bottom-0 left-0 right-0 h-[6px] bg-[#d32f2f] z-20"></div>
<!-- Header / Brand Logo Box -->
<div class="z-20">
<div class="inline-flex items-center gap-3 bg-white px-5 py-4 rounded-xl shadow-md" data-purpose="logo-card">
<!-- ATM Pill Badge -->
<span class="bg-[#d32f2f] text-white text-base lg:text-lg font-bold px-3 py-1 rounded-md tracking-wider">
          ATM
        </span>
<!-- SIG Logo graphic + typography -->
<div class="flex items-center gap-1">
<svg class="h-8 w-auto" fill="none" viewbox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
<!-- Chevron graphic representing SIG roof icon -->
<path d="M26 4L34 14H28L26 11.5L24 14H18L26 4Z" fill="#d32f2f"></path>
<!-- Text SIG -->
<text fill="#18191f" font-family="Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" x="0" y="34">SIG</text>
</svg>
</div>
</div>
</div>
<!-- Background Silhouette Decorative Bars -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none z-0">
<div class="chart-bar w-16 h-56 left-16"></div>
<div class="chart-bar w-16 h-80 left-36"></div>
<div class="chart-bar w-16 h-48 left-56"></div>
<div class="chart-bar w-16 h-96 left-76" style="left: 19rem;"></div>
<div class="chart-bar w-16 h-64" style="left: 23.5rem;"></div>
</div>
<!-- Bottom Text Branding Information -->
<div class="z-20 relative pt-32 pb-4">
<h1 class="text-white text-3xl sm:text-4xl lg:text-[40px] font-bold tracking-tight leading-tight">
        Accounting Task Manager
      </h1>
<p class="text-gray-400 text-sm sm:text-base font-normal mt-2.5">
        Department of Accounting
      </p>
</div>
</section>
<!-- END: LeftBrandSection -->
<!-- BEGIN: RightLoginSection -->
<section class="w-full md:w-[52%] min-h-screen bg-[#fafafa] flex items-center justify-center p-6 sm:p-10 lg:p-16" data-purpose="signin-container">
<!-- Sign In Card Container -->
<div class="w-full max-w-[460px] bg-white rounded-2xl p-8 sm:p-11 shadow-[0_10px_35px_-4px_rgba(230,150,150,0.18)] border border-[#fbdcdc]" data-purpose="login-card">
<!-- Top ATM Pill inside Form Card -->
<div class="flex justify-center mb-4">
<span class="bg-[#d32f2f] text-white text-xs sm:text-sm font-semibold px-4 py-1 rounded-md tracking-wider shadow-sm">
          ATM
        </span>
</div>
<!-- Header Content -->
<div class="text-center mb-8">
<h2 class="text-2xl sm:text-[26px] font-bold text-gray-900 tracking-tight">
          Sign In
        </h2>
<p class="text-xs sm:text-sm text-gray-500 mt-1.5 font-normal leading-relaxed">
          Masuk untuk mengelola task Department of Accounting
        </p>
</div>
<!-- Sign In Form -->
<form action="#" class="space-y-5" method="POST" onsubmit="event.preventDefault();">
<!-- Username Input Field -->
<div>
<label class="block text-xs sm:text-sm font-semibold text-gray-800 mb-1.5" for="username">
            Username
          </label>
<input class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gray-800 focus:border-gray-800 transition duration-150" id="username" name="username" placeholder="Username" required="" type="text"/>
</div>
<!-- Password Input Field -->
<div>
<label class="block text-xs sm:text-sm font-semibold text-gray-800 mb-1.5" for="password">
            Password
          </label>
<input class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gray-800 focus:border-gray-800 transition duration-150" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<!-- Sign In Submit Button -->
<div class="pt-2">
<button class="w-full py-3 px-4 bg-[#18191f] hover:bg-[#252730] text-white text-sm font-semibold rounded-lg shadow transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900" type="submit">
            Sign In
          </button>
</div>
</form>
<!-- Bottom Hint/Caption Text -->
<div class="text-center mt-6">
<p class="text-xs text-gray-500">
          Login pertama otomatis berstatus Spectator
        </p>
</div>
</div>
</section>
<!-- END: RightLoginSection -->
</body></html>
